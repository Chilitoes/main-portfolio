<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alston Shi — Photography</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400;1,9..144,500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Libre+Caslon+Text:ital,wght@0,400;1,400&family=Crimson+Pro:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500;600&family=Work+Sans:wght@300;400;500&family=Nunito+Sans:wght@300;400;600&family=Lora:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="carousel.css" />

  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
</head>
<body class="theme-dark">
  <!-- Grain overlay: SVG turbulence filter, fixed to viewport -->
  <div class="grain" aria-hidden="true"></div>

  </div>

  <!-- Skip cinematic intro on subsequent navigations within the session -->
  <script>
    if (sessionStorage.getItem('as-intro-seen')) {
      document.documentElement.classList.add('intro-seen');
    }
  </script>

  <!-- Cinematic intro -->
  <div id="intro" class="intro" role="presentation">
    <div class="intro-grain"></div>
    <div class="intro-leak"></div>

    <div class="intro-frame">
      <span class="intro-corner tl"></span>
      <span class="intro-corner tr"></span>
      <span class="intro-corner bl"></span>
      <span class="intro-corner br"></span>
      <span class="intro-line top"></span>
      <span class="intro-line bot"></span>

      <div class="intro-photo p1" style="background-image:url('images/Japan/IMG_0393.JPG')"></div>
      <div class="intro-photo p2" style="background-image:url('images/Japan/IMG_8970.JPG')"></div>
      <div class="intro-photo p3" style="background-image:url('images/Japan/IMG_6229%202.JPG')"></div>
      <div class="intro-vignette"></div>
    </div>

    <div class="intro-tag">
      <div class="intro-tag-name">Alston <span class="intro-italic">Shi</span></div>
      <div class="intro-tag-sub">Photography &nbsp;·&nbsp; Est. 2020</div>
    </div>

    <div class="intro-logo">A<span class="intro-italic">S</span></div>

    <button class="intro-skip" aria-label="Skip intro">Skip</button>
  </div>

  <div id="app"></div>

  <script>
    window.TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "serifFamily": "Cormorant Garamond",
      "sansFamily": "Inter",
      "monoFamily": "JetBrains Mono",
      "headlineWeight": 300,
      "headlineTracking": -0.03
    }/*EDITMODE-END*/;
  </script>
  <script type="text/babel" data-presets="env,react" src="tweaks-panel.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="data.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="core.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="chrome.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="carousel.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="home.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="portfolio.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="about.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="contact.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="app.jsx"></script>
</body>
</html>
