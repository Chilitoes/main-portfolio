<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- ── Content Security Policy ─────────────────────────────────
       Restricts where scripts/styles/fonts/connections may come from.
       'unsafe-inline' is kept for scripts because two inline blocks below
       (the intro-skip check and TWEAK_DEFAULTS, which the edit host rewrites
       on disk) can't carry a stable hash; the CDN React bundles are pinned
       with Subresource Integrity instead. frame-ancestors is intentionally
       omitted so the edit-mode host can still load the site in an iframe. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://formspree.io https://cloudflareinsights.com https://static.cloudflareinsights.com; form-action 'self' https://formspree.io; base-uri 'self'; object-src 'none'" />

  <!-- ── Primary SEO ────────────────────────────────────────── -->
  <title>Alston Shi — Travel &amp; Editorial Photographer | Singapore</title>
  <meta name="description" content="Alston Shi is a Singapore-based travel and editorial photographer documenting people and places across Asia since 2020. Browse the archive of work from Japan, China, Taiwan, and beyond." />

  <meta name="author" content="Alston Shi" />
  <meta name="application-name" content="Alston Shi" />
  <meta name="apple-mobile-web-app-title" content="Alston Shi" />

  <meta name="ICBM" content="1.3521, 103.8198" />

  <!-- ── Analytics (Cloudflare Web Analytics — free, no cookies, GDPR safe) ──
       SETUP — replace YOUR_BEACON_TOKEN below after:
         1. dash.cloudflare.com  →  Sign up (free)
         2. Web Analytics  →  Add a site  →  paste 'alstonshi.com'
         3. Copy the token from the snippet they show you
         4. Paste it below in place of YOUR_BEACON_TOKEN
       The token is the only required field. No DNS / proxy change needed. ── -->
  <script defer src='https://static.cloudflareinsights.com/beacon.min.js'
          data-cf-beacon='{"token": "d15cac2fb3014ff68245379748ce1dfa"}'></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Production visitors only ever see the three default families (serif /
       sans / mono). Shipping just these keeps the render-blocking font request
       small. The full set the Tweaks panel can switch between is loaded lazily
       only when edit mode activates (see tweaks-panel.jsx). -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="carousel.css" />
  <link rel="stylesheet" href="intro.css" />

  <!-- React production builds (smaller, faster, no dev warnings).
       Babel-standalone removed; JSX is precompiled to /dist by `npm run build`
       and shipped as plain JS. ──────────────────────────────────────────────── -->
  <script defer crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"
          integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z"></script>
  <script defer crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"
          integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1"></script>
</head>
<body class="theme-dark">
  <!-- Grain overlay: SVG turbulence filter, fixed to viewport -->
  <div class="grain" aria-hidden="true"></div>

  <!-- Skip cinematic intro on subsequent navigations within the session -->
  <script>
    if (sessionStorage.getItem('as-intro-seen')) {
      document.documentElement.classList.add('intro-seen');
    }
    // Failsafe: if React (CDN) never loads, hideLoader() is never called and
    // the intro would cover the site forever. Force-dismiss after 12 s if the
    // app hasn't mounted.
    setTimeout(function () {
      var app = document.getElementById('app');
      var intro = document.getElementById('intro');
      if (intro && app && !app.childElementCount) intro.remove();
    }, 12000);
  </script>

  <!-- Cinematic intro v2 -->
  <div id="intro" class="intro" role="presentation" aria-hidden="true">

    <!-- Scene 1: Atmosphere -->
    <div class="i-grain"></div>
    <div class="i-vignette"></div>
    <div class="i-diag-leak"></div>
    <div class="i-focus-sq"></div>

    <!-- Scene 2: Viewfinder -->
    <div class="i-vf">
      <div class="i-vfl i-vfl-h h1"></div>
      <div class="i-vfl i-vfl-h h2"></div>
      <div class="i-vfl i-vfl-v v1"></div>
      <div class="i-vfl i-vfl-v v2"></div>
      <div class="i-vfl i-vfl-h h3"></div>
      <div class="i-vfl i-vfl-v v3"></div>
      <div class="i-vfc tl"><span class="h"></span><span class="v"></span></div>
      <div class="i-vfc tr"><span class="h"></span><span class="v"></span></div>
      <div class="i-vfc bl"><span class="h"></span><span class="v"></span></div>
      <div class="i-vfc br"><span class="h"></span><span class="v"></span></div>
      <div class="i-vf-fp fp1"></div>
      <div class="i-vf-fp fp2"></div>
    </div>
    <div class="i-ui">
      <div class="i-ui-item iso">ISO 1600</div>
      <div class="i-ui-item fstop">f / 1.4</div>
      <div class="i-ui-item ss">1/250</div>
      <div class="i-ui-item exp">EXP +0.3</div>
    </div>

    <!-- Scene 3: Editorial images -->
    <div class="i-imgs">
      <div class="i-img-bg"></div>
      <div class="i-img-main"></div>
      <div class="i-img-l"></div>
      <div class="i-img-r"></div>
      <div class="i-rack-focus"></div>
    </div>

    <!-- Scene 4: Accents -->
    <div class="i-edge-t"></div>
    <div class="i-edge-b"></div>
    <div class="i-flare"></div>

    <!-- Scene 5: Typography -->
    <div class="i-tag">
      <p class="i-name">Alston <em>Shi</em></p>
      <p class="i-sub">Photography &nbsp;&middot;&nbsp; Est.&nbsp;2020</p>
    </div>

    <!-- Scene 6: Logo -->
    <div class="i-logo-bg-leak"></div>
    <div class="i-logo"><span class="al-a">A</span><em class="al-s">S</em></div>

    <!-- Exit -->
    <div class="i-snap"></div>

    <!-- Loading progress bar -->
    <div class="i-loadbar-track"><div class="i-loadbar"></div></div>

    <button class="i-skip">SKIP</button>
  </div>

  <div id="app"></div>

  <script>
    window.TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "serifFamily": "Cormorant Garamond",
      "sansFamily": "Inter",
      "monoFamily": "JetBrains Mono",
      "headlineWeight": 300,
      "headlineTracking": -0.03
    }/*EDITMODE-END*/;
  </script>
  <!-- Compiled bundles from `npm run build` (CI runs this before SFTP deploy).
       Order matters: each later script reads window.X exports from earlier
       ones. `defer` keeps load non-blocking but preserves execution order. -->
  <script defer src="dist/tweaks-panel.js"></script>
  <script defer src="dist/data.js"></script>
  <script defer src="dist/core.js"></script>
  <script defer src="dist/chrome.js"></script>
  <script defer src="lib/three.min.js"></script>
  <script defer src="dist/carousel.js"></script>
  <script defer src="dist/camera-3d.js"></script>
  <script defer src="dist/home.js"></script>
  <script defer src="dist/portfolio.js"></script>
  <script defer src="dist/about.js"></script>
  <script defer src="dist/contact.js"></script>
  <script defer src="dist/app.js"></script>
</body>
</html>
