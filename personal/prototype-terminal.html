<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes" />
  <meta name="robots" content="noindex, nofollow" />
  <title>~ — alston@portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg:        #0E0D0B;
      --bg-elev:   #15120E;
      --bg-deep:   #060504;
      --fg:        #E8E0D0;
      --fg-dim:    #8A8073;
      --fg-mute:   #4A443C;
      --ochre:     #C8A265;
      --amber:     #E0A23F;
      --red:       #E0594F;
      --green:     #7FE0A0;
      --blue:      #7FB5E0;
      --magenta:   #C88AC8;
      --cyan:      #7FE0DA;
      --line:      rgba(232,224,208,0.08);
      --line-h:    rgba(232,224,208,0.16);
      --mono:      "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --ease:      cubic-bezier(0.22, 1, 0.36, 1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--mono);
      font-size: 14px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    a { color: var(--ochre); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

    /* ───────────────── Prototype watermark ─────────────────── */
    .proto-tag {
      position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
      z-index: 999; font-size: 9.5px; letter-spacing: 0.22em;
      color: rgba(232,224,208,0.35);
      background: rgba(0,0,0,0.4);
      padding: 4px 10px; border-radius: 999px;
      border: 1px solid rgba(232,224,208,0.1);
      pointer-events: none; text-transform: uppercase;
    }

    /* ───────────────── CRT-ish scanlines + grain ──────────── */
    .crt::before, .crt::after {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50;
    }
    .crt::before {
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,0.012) 0,
          rgba(255,255,255,0.012) 1px,
          transparent 1px,
          transparent 3px
        );
    }
    .crt::after {
      background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.45) 100%);
    }

    /* ───────────────── Boot screen ─────────────────────────── */
    #boot {
      position: fixed; inset: 0; z-index: 200;
      background: var(--bg-deep);
      color: var(--fg-dim);
      font-family: var(--mono);
      font-size: 13px;
      padding: 12vh 6vw;
      overflow: hidden;
    }
    #boot.gone { opacity: 0; visibility: hidden; transition: opacity 0.5s var(--ease), visibility 0s 0.5s; }
    #boot .line { margin: 2px 0; opacity: 0; animation: bootIn 0.001s linear forwards; }
    #boot .ok    { color: var(--green); }
    #boot .warn  { color: var(--amber); }
    #boot .fail  { color: var(--red); }
    #boot .dim   { color: var(--fg-mute); }
    #boot .accent { color: var(--ochre); }
    #boot .hl     { color: var(--fg); }
    #boot .banner {
      color: var(--ochre); margin: 18px 0 8px;
      white-space: pre; font-weight: 500;
    }
    @keyframes bootIn { to { opacity: 1; } }

    /* ───────────────── App shell ───────────────────────────── */
    .app {
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100vh; height: 100dvh;
      background: var(--bg);
    }

    /* Window-style title bar */
    .titlebar {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 14px;
      background: var(--bg-deep);
      border-bottom: 1px solid var(--line-h);
      font-size: 12px;
      color: var(--fg-dim);
      user-select: none;
    }
    .traffic { display: flex; gap: 7px; margin-right: 12px; }
    .traffic span { width: 11px; height: 11px; border-radius: 50%; display: block; }
    .traffic .r { background: #E0594F; }
    .traffic .y { background: #E0A23F; }
    .traffic .g { background: #7FE0A0; }
    .tab {
      padding: 4px 12px; border-radius: 4px;
      background: rgba(200,162,101,0.08);
      color: var(--fg); font-size: 12px;
      border: 1px solid rgba(200,162,101,0.12);
    }
    .titlebar .spacer { flex: 1; }
    .titlebar .clock { color: var(--fg-mute); font-size: 11px; letter-spacing: 0.1em; }
    .titlebar .gear { color: var(--fg-mute); font-size: 11px; }

    /* Body row: sidebar + content */
    .body-row {
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: 0;
    }
    .body-row.no-side { grid-template-columns: 1fr; }
    .sidebar {
      background: var(--bg-deep);
      border-right: 1px solid var(--line);
      padding: 18px 14px;
      overflow-y: auto;
      min-height: 0;
    }
    .sidebar h4 {
      font-size: 9.5px; letter-spacing: 0.28em; text-transform: uppercase;
      color: var(--fg-mute); margin: 14px 0 8px;
      font-weight: 500;
    }
    .sidebar h4:first-child { margin-top: 0; }
    .sidebar .quick { display: flex; flex-direction: column; gap: 2px; }
    .sidebar .qb {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 8px; border-radius: 4px;
      color: var(--fg-dim); font-size: 12.5px;
      transition: background 0.15s ease, color 0.15s ease;
      text-align: left; width: 100%;
    }
    .sidebar .qb:hover { background: rgba(200,162,101,0.08); color: var(--fg); }
    .sidebar .qb .key { color: var(--ochre); width: 14px; text-align: center; }
    .sidebar .qb .cmd { color: inherit; }
    .sidebar .qb .desc { color: var(--fg-mute); font-size: 11px; margin-left: auto; }
    .sidebar .legend {
      font-size: 11px; color: var(--fg-mute); margin-top: 16px; line-height: 1.7;
    }
    .sidebar .legend kbd {
      display: inline-block; padding: 1px 5px; border-radius: 3px;
      background: rgba(232,224,208,0.08); border: 1px solid var(--line-h);
      color: var(--fg-dim); font-size: 10.5px; margin: 0 2px;
    }
    .sidebar-toggle {
      position: absolute; top: 64px; left: 10px; z-index: 30;
      width: 22px; height: 22px; border-radius: 4px;
      background: var(--bg-deep); border: 1px solid var(--line-h);
      color: var(--fg-dim);
      display: none; align-items: center; justify-content: center;
      font-size: 12px;
    }

    /* Content area */
    .content {
      min-height: 0;
      display: flex; flex-direction: column;
      background: var(--bg);
    }
    .scroll {
      flex: 1;
      overflow-y: auto;
      padding: 18px 22px 6px;
      scroll-behavior: smooth;
    }
    .scroll::-webkit-scrollbar { width: 8px; }
    .scroll::-webkit-scrollbar-track { background: transparent; }
    .scroll::-webkit-scrollbar-thumb { background: rgba(232,224,208,0.1); border-radius: 8px; }

    /* Output lines */
    .out > * { white-space: pre-wrap; word-break: break-word; }
    .out .blk { margin: 0 0 10px; }
    .out .prompt-line { color: var(--fg-dim); margin-top: 14px; }
    .out .prompt-line .user { color: var(--ochre); font-weight: 500; }
    .out .prompt-line .at   { color: var(--fg-dim); }
    .out .prompt-line .host { color: var(--green); }
    .out .prompt-line .path { color: var(--blue); }
    .out .prompt-line .dollar { color: var(--ochre); margin: 0 6px; }
    .out .prompt-line .cmdtxt { color: var(--fg); }
    .out .ok { color: var(--green); }
    .out .warn { color: var(--amber); }
    .out .err { color: var(--red); }
    .out .dim { color: var(--fg-dim); }
    .out .mute { color: var(--fg-mute); }
    .out .accent { color: var(--ochre); }
    .out .hl { color: var(--fg); font-weight: 500; }
    .out h1, .out h2, .out h3 { font-weight: 500; color: var(--ochre); letter-spacing: 0.02em; }
    .out h1 { font-size: 16px; margin: 6px 0 8px; }
    .out h2 { font-size: 14px; margin: 12px 0 6px; }
    .out h3 { font-size: 13px; margin: 10px 0 4px; color: var(--fg); }
    .out p { margin: 0 0 8px; color: var(--fg); }
    .out p .em { color: var(--ochre); }

    /* File listing rows (ls/tree) */
    .row { display: flex; gap: 12px; }
    .row .perm { color: var(--fg-mute); }
    .row .size { color: var(--fg-dim); width: 7ch; text-align: right; }
    .row .date { color: var(--fg-mute); width: 14ch; }
    .row .name { color: var(--fg); }
    .row .name.exe { color: var(--green); }
    .row .name.dir { color: var(--blue); }
    .row .name.img { color: var(--magenta); }
    .row .name.cred { color: var(--cyan); }
    .row a.name:hover { text-decoration: underline; cursor: pointer; }

    /* git log entries */
    .gl { display: flex; gap: 10px; padding: 2px 0; }
    .gl .hash { color: var(--amber); }
    .gl .date { color: var(--fg-mute); }
    .gl .msg  { color: var(--fg); }
    .gl .msg .scope { color: var(--ochre); }

    /* Tree view */
    .tree { color: var(--fg); }
    .tree .branch { color: var(--fg-mute); }
    .tree .leaf { color: var(--fg); }
    .tree .root { color: var(--ochre); }
    .tree .badge { color: var(--green); font-size: 10.5px; margin-left: 6px; }

    /* Cat / card */
    .card {
      margin: 6px 0 12px;
      padding: 12px 16px;
      border-left: 2px solid var(--ochre);
      background: var(--bg-elev);
      border-radius: 0 4px 4px 0;
    }
    .card .meta { color: var(--fg-dim); font-size: 11.5px; }
    .card h3 { color: var(--ochre); }
    .card ul { margin: 6px 0 0 18px; }
    .card li { color: var(--fg); margin: 2px 0; }
    .card li::marker { color: var(--ochre); }
    .card .stack { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .card .chip {
      font-size: 10.5px; padding: 2px 8px; border-radius: 3px;
      background: rgba(200,162,101,0.1); color: var(--ochre);
      border: 1px solid rgba(200,162,101,0.2);
    }

    /* Image thumbnails (kitty/sixel style inline images) */
    .img-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 10px; }
    .img-row .thumb {
      width: 110px; height: 84px;
      border-radius: 3px; overflow: hidden;
      border: 1px solid var(--line-h);
      position: relative; cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .img-row .thumb:hover { transform: translateY(-2px); border-color: var(--ochre); }
    .img-row .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .img-row .thumb .label {
      position: absolute; left: 4px; bottom: 3px;
      font-size: 9px; color: var(--fg);
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
      letter-spacing: 0.06em;
    }

    /* Mail / contact form (inline) */
    .mail {
      margin: 6px 0 12px;
      border: 1px dashed var(--line-h);
      padding: 12px 14px; border-radius: 4px;
    }
    .mail .mh { color: var(--fg-dim); }
    .mail .mh .k { color: var(--ochre); }
    .mail input, .mail textarea {
      background: transparent; border: 0; border-bottom: 1px solid var(--line);
      color: var(--fg); font: inherit; padding: 4px 0; width: 100%;
      outline: none; margin: 4px 0;
    }
    .mail input:focus, .mail textarea:focus { border-bottom-color: var(--ochre); }
    .mail textarea { resize: none; min-height: 84px; }
    .mail .send {
      margin-top: 8px; padding: 6px 14px;
      background: var(--ochre); color: var(--bg-deep);
      border-radius: 3px; font-weight: 600;
      font-size: 12px; letter-spacing: 0.05em;
    }
    .mail .send:hover { filter: brightness(1.08); }
    .mail .status { font-size: 11.5px; margin-top: 6px; }

    /* Input line — bottom */
    .input-row {
      display: flex; align-items: center;
      padding: 10px 22px 14px;
      border-top: 1px solid var(--line);
      background: var(--bg);
      font-family: var(--mono);
    }
    .input-row .prompt {
      display: flex; align-items: center; gap: 0; margin-right: 8px;
      white-space: nowrap;
    }
    .input-row .prompt .user { color: var(--ochre); font-weight: 500; }
    .input-row .prompt .at   { color: var(--fg-dim); }
    .input-row .prompt .host { color: var(--green); }
    .input-row .prompt .colon { color: var(--fg-dim); }
    .input-row .prompt .path { color: var(--blue); }
    .input-row .prompt .dollar { color: var(--ochre); margin: 0 8px 0 6px; }
    .input-row input {
      flex: 1; background: transparent; border: 0; outline: none;
      color: var(--fg); font: inherit; padding: 0;
      caret-color: var(--ochre);
    }
    .ghost {
      pointer-events: none; user-select: none;
      color: var(--fg-mute);
      margin-left: -0.6ch;
    }
    .input-row .cursor {
      display: inline-block;
      width: 8px; height: 16px;
      background: var(--ochre);
      vertical-align: -3px;
      animation: blink 1s steps(1) infinite;
      margin-left: 1px;
    }
    @keyframes blink { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }

    /* Lightbox */
    .lb {
      position: fixed; inset: 0; z-index: 300;
      background: rgba(0,0,0,0.88); backdrop-filter: blur(10px);
      display: none; align-items: center; justify-content: center;
      cursor: zoom-out;
    }
    .lb.open { display: flex; }
    .lb img { max-width: 88vw; max-height: 84vh; box-shadow: 0 40px 80px rgba(0,0,0,0.6); }
    .lb .lbcap {
      position: absolute; bottom: 24px; left: 0; right: 0;
      text-align: center; font-size: 11px; letter-spacing: 0.2em;
      color: var(--fg-dim); text-transform: uppercase;
    }

    /* Theme: light variant */
    body.theme-light {
      --bg: #F2EDE3; --bg-elev: #EAE3D5; --bg-deep: #E0D8C8;
      --fg: #2A2520; --fg-dim: #6A6058; --fg-mute: #A09684;
      --ochre: #9A6B2C; --amber: #B57810;
      --line: rgba(42,37,32,0.10); --line-h: rgba(42,37,32,0.18);
    }

    /* Mobile */
    @media (max-width: 760px) {
      .body-row { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .sidebar.open {
        display: block; position: fixed; left: 0; top: 38px;
        width: 80vw; max-width: 320px; height: calc(100% - 38px);
        z-index: 40; box-shadow: 0 0 30px rgba(0,0,0,0.6);
      }
      .sidebar-toggle { display: inline-flex; }
      .scroll { padding: 14px 16px 6px; }
      .input-row { padding: 8px 14px 12px; }
      .titlebar .clock, .titlebar .gear { display: none; }
    }
  </style>
</head>
<body class="crt">
  <div class="proto-tag">prototype · /personal/prototype-terminal.html</div>

  <!-- ─── Boot screen ─── -->
  <div id="boot">
    <div id="bootLines"></div>
  </div>

  <!-- ─── App ─── -->
  <div class="app" id="app" hidden>
    <div class="titlebar">
      <span class="traffic"><span class="r"></span><span class="y"></span><span class="g"></span></span>
      <span class="tab">alston@portfolio: ~</span>
      <span class="spacer"></span>
      <span class="gear" id="gear">tty/1 · 80x24</span>
      <span class="clock" id="clock">--:--:-- SGT</span>
    </div>

    <button class="sidebar-toggle" id="sideToggle" aria-label="Menu">☰</button>

    <div class="body-row" id="bodyRow">
      <aside class="sidebar" id="sidebar">
        <h4>Quick commands</h4>
        <div class="quick">
          <button class="qb" data-cmd="whoami"><span class="key">$</span><span class="cmd">whoami</span><span class="desc">about</span></button>
          <button class="qb" data-cmd="ls projects/"><span class="key">$</span><span class="cmd">ls projects/</span><span class="desc">work</span></button>
          <button class="qb" data-cmd="tree skills/"><span class="key">$</span><span class="cmd">tree skills/</span><span class="desc">stack</span></button>
          <button class="qb" data-cmd="git log --oneline"><span class="key">$</span><span class="cmd">git log</span><span class="desc">exp</span></button>
          <button class="qb" data-cmd="ls images/"><span class="key">$</span><span class="cmd">ls images/</span><span class="desc">photos</span></button>
          <button class="qb" data-cmd='mail -s "hello" alston'><span class="key">$</span><span class="cmd">mail</span><span class="desc">contact</span></button>
          <button class="qb" data-cmd="open resume.pdf"><span class="key">$</span><span class="cmd">open resume.pdf</span><span class="desc">cv</span></button>
        </div>
        <h4>Utilities</h4>
        <div class="quick">
          <button class="qb" data-cmd="help"><span class="key">?</span><span class="cmd">help</span><span class="desc">all commands</span></button>
          <button class="qb" data-cmd="theme toggle"><span class="key">~</span><span class="cmd">theme toggle</span><span class="desc">light/dark</span></button>
          <button class="qb" data-cmd="clear"><span class="key">␘</span><span class="cmd">clear</span><span class="desc">^L</span></button>
        </div>
        <div class="legend">
          <div><kbd>Tab</kbd> autocomplete</div>
          <div><kbd>↑</kbd> <kbd>↓</kbd> history</div>
          <div><kbd>Ctrl</kbd>+<kbd>L</kbd> clear</div>
          <div><kbd>g</kbd> then a letter: jump</div>
        </div>
      </aside>

      <div class="content">
        <div class="scroll" id="scroll">
          <div class="out" id="out"></div>
        </div>
        <form class="input-row" id="inputForm" autocomplete="off">
          <div class="prompt">
            <span class="user">alston</span><span class="at">@</span><span class="host">portfolio</span><span class="colon">:</span><span class="path" id="cwdLabel">~</span><span class="dollar">$</span>
          </div>
          <div style="position: relative; flex: 1; display: flex;">
            <input id="cmdInput" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus />
            <span class="ghost" id="ghost"></span>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Lightbox -->
  <div class="lb" id="lb"><img id="lbImg" src="" alt="" /><div class="lbcap" id="lbCap"></div></div>

<script>
/* ════════════════════════════════════════════════════════════════════════
   Terminal portfolio — prototype
   ════════════════════════════════════════════════════════════════════════ */

const $  = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => Array.from(el.querySelectorAll(s));

// Image base (this file lives in /personal/, photos live in /images/)
const IMG = (p) => "../images/" + p.split("/").map(encodeURIComponent).join("/");

/* ──────── State ──────── */
const State = {
  cwd: "~",
  history: [],
  histIdx: -1,
  draft: "",
  theme: localStorage.getItem("term-theme") || "dark",
};
document.body.classList.toggle("theme-light", State.theme === "light");

/* ──────── Boot sequence ──────── */
const bootLog = [
  { d: 0,    t: "[    0.0001 ] alstonOS 4.7.2 (warm-dark) booting…", c: "dim" },
  { d: 90,   t: "[    0.0312 ] Mounting /portfolio … done.", c: "ok" },
  { d: 110,  t: "[    0.0844 ] Loading GPG keys ............................ [  OK  ]", c: "ok" },
  { d: 120,  t: "[    0.1241 ] Starting sshd .................................... [  OK  ]", c: "ok" },
  { d: 100,  t: "[    0.1632 ] Starting cron .................................... [  OK  ]", c: "ok" },
  { d: 110,  t: "[    0.1944 ] Starting cloudflare-tunnel ....................... [  OK  ]", c: "ok" },
  { d: 130,  t: "[    0.2391 ] Starting coffee.service .......................... [ WAIT ]", c: "warn" },
  { d: 220,  t: "[    0.4810 ] coffee.service ................................... [  OK  ]", c: "ok" },
  { d: 120,  t: "[    0.5102 ] Mounting /home/alston ............................ [  OK  ]", c: "ok" },
  { d: 100,  t: "[    0.5512 ] Loading shell aliases ............................ [  OK  ]", c: "ok" },
  { d: 200,  t: "", c: "dim" },
  { d: 0,    t:
`         _     _                     _     _
   __ _ | |___| |_ ___  _ __   ___| |__ (_)
  / _\` || / __| __/ _ \\| '_ \\ / __| '_ \\| |
 | (_| || \\__ \\ || (_) | | | | (__| | | | |
  \\__,_||_|___/\\__\\___/|_| |_|\\___|_| |_|_|`, c: "banner" },
  { d: 200,  t: "", c: "dim" },
  { d: 0,    t: "Welcome to alstonOS 4.7.2 LTS (warm-dark)", c: "hl" },
  { d: 60,   t: "Last login: just now from a curious browser", c: "dim" },
  { d: 60,   t: "", c: "dim" },
  { d: 80,   t: "Tip: type 'help' for available commands, or click anything on the left →", c: "accent" },
  { d: 60,   t: "      try `whoami`, `ls`, or `cat about.md` to start.", c: "dim" },
];

const bootEl = $("#bootLines");
let bootDelay = 0;
bootLog.forEach((l, i) => {
  bootDelay += l.d;
  const div = document.createElement("div");
  div.className = "line " + (l.c || "");
  div.textContent = l.t;
  div.style.animationDelay = bootDelay + "ms";
  bootEl.appendChild(div);
});
const bootDoneAt = bootDelay + 700;

const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const sessionSeen = sessionStorage.getItem("term-boot-seen");

if (sessionSeen || reduceMotion) {
  $("#boot").remove();
  $("#app").hidden = false;
  startSession({ silent: true });
} else {
  setTimeout(() => {
    $("#boot").classList.add("gone");
    $("#app").hidden = false;
    sessionStorage.setItem("term-boot-seen", "1");
    startSession();
    setTimeout(() => $("#boot")?.remove(), 800);

  const groups = ["languages","design","security","cloud"];
  let html = `<div class="tree"><div class="root">skills/</div>`;
  groups.forEach((g, gi) => {
    const isLast = gi === groups.length - 1;
    const groupRows = SKILLS.filter(s => s.group === g);
    const tiers = ["daily","certified","comfortable","learning"];
    html += `<div><span class="branch">${isLast ? "└── " : "├── "}</span><span class="leaf">${g}/</span></div>`;
    let tierShown = groupRows.flatMap(r => tiers.includes(r.tier) ? [r] : []);
    tierShown.forEach((r, ti) => {
      const lastT = ti === tierShown.length - 1;
      const tierLabel = `[${r.tier.padEnd(11," ")}]`;
      r.items.forEach((it, ii) => {
        const lastI = ii === r.items.length - 1;
        const pre = (isLast ? "    " : "│   ") + (lastT && lastI ? "└── " : "├── ");
        const tierPre = ii === 0 ? `<span class="badge">${tierLabel}</span>` : "";
        html += `<div><span class="branch">${pre}</span><span class="leaf">${escapeHtml(it)}</span>${tierPre}</div>`;
      });
    });
  });
  html += `</div>`;
  printRaw(html);
}, "tree view");

    <ul>${p.highlights.map(h => `<li>${escapeHtml(h)}</li>`).join("")}</ul>
    <h3 style="margin-top:12px; color:var(--ochre); font-size:11px; letter-spacing:0.22em; text-transform:uppercase">stack</h3>
    <div class="stack">${p.stack.map(s => `<span class="chip">${escapeHtml(s)}</span>`).join("")}</div>
    <p style="margin-top:12px">→ <a href="${p.link}" target="_blank" rel="noopener">${p.isLocal ? "View on GitHub" : "Open live →"}</a>${placeholder ? ' <span class="dim">(local / not publicly deployed)</span>' : ''}</p>
  </div>`);
}

function renderMail(subject) {
  const html = `<div class="mail">
    <div class="mh"><span class="k">From:</span> you</div>
    <div class="mh"><span class="k">To:</span> swnssoe@gmail.com</div>
    <div class="mh"><span class="k">Subject:</span> ${escapeHtml(subject)}</div>
    <input type="text" id="mn" placeholder="-- your name --" />
    <input type="email" id="me" placeholder="-- your email --" />
    <textarea id="mb" placeholder="-- compose message --"></textarea>
    <button class="send" id="msend">:wq  send</button>
    <div class="status dim" id="mst">esc to cancel · this is a prototype — submissions will be wired to Formspree</div>
  </div>`;
  const block = printRaw(html);
  setTimeout(() => $("#mn", block)?.focus(), 50);
  $("#msend", block).addEventListener("click", () => {
    const n = $("#mn", block).value.trim();
    const e = $("#me", block).value.trim();
    const b = $("#mb", block).value.trim();
    const st = $("#mst", block);
    if (!n || !e || !b) { st.textContent = "missing fields. fill all three to send."; st.className = "status err"; return; }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) { st.textContent = "invalid email."; st.className = "status err"; return; }
    st.textContent = "[ prototype ] would post to Formspree mzdwokqp. ✓"; st.className = "status ok";
  });
}

/* ──────── Input ──────── */
const input = $("#cmdInput");
const ghost = $("#ghost");
const form  = $("#inputForm");

function getCompletion(s) {
  if (!s) return "";
  const tokens = s.split(/\s+/);
  // Complete first token (command)
  if (tokens.length === 1) {
    const prefix = tokens[0];
    const match = Object.keys(COMMANDS).find(c => !COMMANDS[c].aliasOf && c.startsWith(prefix) && c !== prefix);
    return match ? match.slice(prefix.length) : "";
  }
  // Complete file arg for cat/ls/cd/open
  const cmd = tokens[0];
  const arg = tokens.slice(1).join(" ");
  if (cmd === "cat" || cmd === "open") {
    const opts = ["about.md","now.md","contact","resume.pdf"].concat(PROJECTS.map(p => `projects/${p.slug}.md`));
    const m = opts.find(o => o.startsWith(arg) && o !== arg);
    if (m) return m.slice(arg.length);
  }
  if (cmd === "ls" || cmd === "cd" || cmd === "tree") {
    const opts = ["projects/","skills/","images/","experience/"];
    const m = opts.find(o => o.startsWith(arg) && o !== arg);
    if (m) return m.slice(arg.length);
  }
  return "";
}

input.addEventListener("input", () => {
  ghost.textContent = getCompletion(input.value);
});

input.addEventListener("keydown", (e) => {
  if (e.key === "Tab") {
    e.preventDefault();
    const c = getCompletion(input.value);
    if (c) { input.value += c; ghost.textContent = ""; }
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    if (State.histIdx === -1) State.draft = input.value;
    if (State.history.length === 0) return;
    State.histIdx = State.histIdx === -1 ? State.history.length - 1 : Math.max(0, State.histIdx - 1);
    input.value = State.history[State.histIdx] || "";
    ghost.textContent = "";
  } else if (e.key === "ArrowDown") {
    e.preventDefault();
    if (State.histIdx === -1) return;
    State.histIdx++;
    if (State.histIdx >= State.history.length) { State.histIdx = -1; input.value = State.draft; }
    else input.value = State.history[State.histIdx];
    ghost.textContent = "";
  } else if (e.ctrlKey && (e.key === "l" || e.key === "L")) {
    e.preventDefault();
    COMMANDS.clear.fn([]);
  } else if (e.ctrlKey && (e.key === "c" || e.key === "C")) {
    if (input.value) { echoPrompt(input.value); println("^C", "dim"); input.value = ""; ghost.textContent = ""; e.preventDefault(); }
  }
});

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const raw = input.value.trim();
  if (!raw) return;
  echoPrompt(raw);
  State.history.push(raw);
  State.histIdx = -1;
  input.value = ""; ghost.textContent = "";
  runCommand(raw);
});

function runCommand(raw) {
  const tokens = tokenize(raw);
  const name = tokens[0];
  const args = tokens.slice(1);
  const cmd = COMMANDS[name];
  if (!cmd) { err(`${name}: command not found. try 'help'`); return; }
  try { cmd.fn(args); }
  catch (e) { err(`error: ${e.message || e}`); }
}

function tokenize(s) {
  const out = []; let cur = ""; let quoted = false;
  for (const c of s) {
    if (c === '"') { quoted = !quoted; continue; }
    if (c === " " && !quoted) { if (cur) { out.push(cur); cur = ""; } continue; }
    cur += c;
  }
  if (cur) out.push(cur);
  return out;
}

/* ──────── Clickable run-cmd links ──────── */
document.addEventListener("click", (e) => {
  const t = e.target.closest(".run-cmd, .qb");
  if (t) {
    e.preventDefault();
    const cmd = t.dataset.cmd;
    if (cmd) {
      input.value = cmd;
      ghost.textContent = "";
      form.requestSubmit();
    }
    if (window.matchMedia("(max-width: 760px)").matches) $("#sidebar")?.classList.remove("open");
  }
  const thumb = e.target.closest(".thumb");
  if (thumb) {
    const src = thumb.dataset.img, cap = thumb.dataset.cap;
    $("#lbImg").src = src; $("#lbCap").textContent = cap; $("#lb").classList.add("open");
  }
  if (e.target.closest("#lb")) $("#lb").classList.remove("open");
});

$("#sideToggle").addEventListener("click", () => $("#sidebar").classList.toggle("open"));

/* ──────── Vim-style jumps (g + letter) ──────── */
let gKey = false; let gTimer;
window.addEventListener("keydown", (e) => {
  if (document.activeElement && document.activeElement.matches("input,textarea")) return;
  if (e.key === "g") { gKey = true; clearTimeout(gTimer); gTimer = setTimeout(() => gKey = false, 1200); return; }
  if (gKey) {
    gKey = false;
    const map = { a: "whoami", p: "ls projects/", s: "tree skills/", e: "git log --oneline", c: "cat contact" };
    if (map[e.key]) { input.value = map[e.key]; form.requestSubmit(); }
  }
});

/* ──────── Session start ──────── */
function startSession({ silent } = {}) {
  if (!silent) {
    println(`Welcome to alstonOS 4.7.2 LTS — last login from a curious browser.`, "dim");
    println(`Type <span class="accent">help</span> for available commands, or click anything on the left. Try <a class="run-cmd" data-cmd="whoami">whoami</a> · <a class="run-cmd" data-cmd="ls">ls</a> · <a class="run-cmd" data-cmd="cat now.md">cat now.md</a>.`, "");
    blank();
  }
  setTimeout(() => input.focus(), 50);
}
